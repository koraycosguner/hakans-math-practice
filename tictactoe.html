<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tic Tac Toe!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦭</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Nunito',sans-serif;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow-x:hidden;position:relative;
    padding:12px;
  }

  /* ---- background ---- */
  .bg{
    position:fixed;inset:0;z-index:-2;
    background:linear-gradient(135deg,#0d9488 0%,#5eead4 25%,#c4b5fd 50%,#f093fb 75%,#f5576c 100%);
    background-size:400% 400%;
    animation:gradShift 14s ease infinite;
  }
  @keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .floating-shapes{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .floating-shapes span{
    position:absolute;display:block;font-size:2rem;opacity:.15;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(110vh) rotate(0deg);opacity:.15}
    50%{opacity:.22}
    100%{transform:translateY(-10vh) rotate(720deg);opacity:0}
  }

  /* ---- card ---- */
  .card{
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(18px);
    border-radius:28px;
    box-shadow:0 12px 48px rgba(0,60,60,.22);
    padding:22px 24px 26px;
    max-width:480px;width:100%;
    text-align:center;
    position:relative;
    animation:popIn .5s cubic-bezier(.17,.67,.29,1.3);
  }
  @keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

  h1{
    font-family:'Fredoka One',cursive;font-size:1.9rem;
    background:linear-gradient(135deg,#0d9488,#ef4444);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:2px;
  }
  .subtitle{color:#999;font-size:.8rem;margin-bottom:10px}

  /* ---- screens ---- */
  .screen{display:none;animation:popIn .4s ease}
  .screen.active{display:block}

  /* ---- setup screen ---- */
  .name-row{
    display:flex;align-items:center;gap:8px;margin:6px auto;
    max-width:340px;
  }
  .name-row label{
    font-family:'Fredoka One',cursive;font-size:.95rem;
    white-space:nowrap;min-width:70px;text-align:right;
  }
  .name-row label.teal{color:#0d9488}
  .name-row label.red{color:#ef4444}
  .name-input{
    flex:1;font-family:'Nunito',sans-serif;font-weight:700;font-size:.95rem;
    padding:8px 12px;border-radius:12px;border:2.5px solid #e5e7eb;
    outline:none;transition:border-color .2s;
  }
  .name-input:focus{border-color:#a78bfa}
  .name-input.teal-border:focus{border-color:#0d9488}
  .name-input.red-border:focus{border-color:#ef4444}

  .pick-label{
    font-family:'Fredoka One',cursive;font-size:1rem;
    margin:12px 0 6px;
  }
  .pick-label.teal{color:#0d9488}
  .pick-label.red{color:#ef4444}

  .char-grid{
    display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
    margin-bottom:8px;
  }
  .char-opt{
    width:50px;height:50px;font-size:1.65rem;
    border:3px solid #e5e7eb;border-radius:14px;
    background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .char-opt:hover{transform:scale(1.12);border-color:#a1a1aa}
  .char-opt.picked-teal{
    border-color:#0d9488;background:#ccfbf1;
    box-shadow:0 0 0 3px rgba(13,148,136,.25);transform:scale(1.1);
  }
  .char-opt.picked-red{
    border-color:#ef4444;background:#fee2e2;
    box-shadow:0 0 0 3px rgba(239,68,68,.25);transform:scale(1.1);
  }
  .char-opt.taken{opacity:.25;pointer-events:none}

  .start-btn{
    font-family:'Fredoka One',cursive;font-size:1.1rem;
    padding:12px 40px;border:none;border-radius:18px;
    background:linear-gradient(135deg,#0d9488,#14b8a6);
    color:#fff;cursor:pointer;
    box-shadow:0 4px 18px rgba(13,148,136,.35);
    transition:transform .15s,box-shadow .15s;
    margin-top:8px;
  }
  .start-btn:hover{transform:scale(1.06)}
  .start-btn:disabled{opacity:.35;cursor:default;transform:none}

  /* ---- game screen ---- */
  .status{
    font-family:'Fredoka One',cursive;font-size:1.15rem;
    margin:6px 0 10px;min-height:1.5em;transition:color .2s;
  }
  .status.teal{color:#0d9488}
  .status.red{color:#ef4444}
  .status.win{color:#16a34a}
  .status.tie{color:#d97706}

  .board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:8px;margin:0 auto 12px;justify-content:center;
  }
  .cell{
    width:100px;height:100px;
    background:linear-gradient(135deg,#f0fdfa,#e0f2fe);
    border:3.5px solid #cbd5e1;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;
    user-select:none;-webkit-tap-highlight-color:transparent;
    position:relative;overflow:hidden;
  }
  .cell:hover:not(.filled){
    transform:scale(1.06);
    background:linear-gradient(135deg,#ccfbf1,#cffafe);
    border-color:#94a3b8;
  }
  .cell.filled{cursor:default}
  .cell.filled:hover{transform:none}

  .cell-char{
    font-size:2.8rem;line-height:1;
    animation:cellPop .35s cubic-bezier(.17,.67,.29,1.4);
  }
  @keyframes cellPop{0%{transform:scale(0)}100%{transform:scale(1)}}

  .cell.p1{
    border-color:#0d9488;
    background:linear-gradient(135deg,#ccfbf1,#99f6e4);
    box-shadow:inset 0 0 12px rgba(13,148,136,.12),0 2px 8px rgba(13,148,136,.15);
  }
  .cell.p2{
    border-color:#ef4444;
    background:linear-gradient(135deg,#fee2e2,#fecaca);
    box-shadow:inset 0 0 12px rgba(239,68,68,.12),0 2px 8px rgba(239,68,68,.15);
  }

  .cell.win-cell{
    animation:winPulse .6s ease infinite alternate;
    box-shadow:0 0 20px rgba(22,163,74,.45)!important;
    border-color:#16a34a!important;
    background:linear-gradient(135deg,#bbf7d0,#86efac)!important;
  }
  @keyframes winPulse{0%{transform:scale(1)}100%{transform:scale(1.08)}}

  /* ---- scoreboard ---- */
  .scoreboard{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin-bottom:10px;font-weight:800;font-size:.88rem;
  }
  .score-p{
    display:flex;align-items:center;gap:4px;
    padding:5px 14px;border-radius:12px;
  }
  .score-p1{background:#ccfbf1;color:#0d9488}
  .score-p2{background:#fee2e2;color:#ef4444}
  .score-tie{background:#fef3c7;color:#d97706;padding:5px 12px;border-radius:12px}
  .score-p b,.score-tie b{font-size:1.1rem;margin-left:2px}

  .streak{
    font-family:'Fredoka One',cursive;font-size:.85rem;
    color:#8b5cf6;margin-bottom:6px;min-height:1.2em;
  }

  /* ---- buttons ---- */
  .btn-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px}
  .game-btn{
    font-family:'Fredoka One',cursive;font-size:.88rem;
    padding:9px 20px;border:none;border-radius:14px;
    color:#fff;cursor:pointer;transition:transform .15s;
  }
  .game-btn:hover{transform:scale(1.06)}
  .btn-again{
    background:linear-gradient(135deg,#0d9488,#14b8a6);
    box-shadow:0 3px 12px rgba(13,148,136,.3);
    display:none;
  }
  .btn-again.show{display:inline-block;animation:popIn .35s ease}
  .btn-reset{
    background:linear-gradient(135deg,#f59e0b,#f97316);
    box-shadow:0 3px 12px rgba(245,158,11,.3);
  }
  .btn-chars{
    background:linear-gradient(135deg,#8b5cf6,#a78bfa);
    box-shadow:0 3px 12px rgba(139,92,246,.3);
  }

  /* ---- confetti ---- */
  .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
  .confetti-piece{
    position:absolute;width:10px;height:10px;top:-20px;border-radius:2px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(110vh) rotate(1080deg);opacity:0}
  }

  /* ---- winner banner ---- */
  .winner-banner{
    font-family:'Fredoka One',cursive;
    font-size:1.6rem;
    padding:8px 0 2px;
    animation:popIn .5s cubic-bezier(.17,.67,.29,1.3);
  }
  .winner-banner.green{color:#16a34a}
  .winner-banner.gold{color:#d97706}

  /* ---- responsive ---- */
  @media(max-width:420px){
    .card{padding:16px 12px 20px;border-radius:22px}
    h1{font-size:1.5rem}
    .board{grid-template-columns:repeat(3,88px);grid-template-rows:repeat(3,88px);gap:6px}
    .cell{width:88px;height:88px;border-radius:13px}
    .cell-char{font-size:2.4rem}
    .char-opt{width:44px;height:44px;font-size:1.4rem}
    .name-row{max-width:100%}
  }
  @media(max-width:350px){
    .board{grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);gap:5px}
    .cell{width:76px;height:76px}
    .cell-char{font-size:2rem}
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="floating-shapes" id="shapes"></div>

<div class="card">
  <h1>Tic Tac Toe!</h1>
  <div class="subtitle">Hakan's Game Corner</div>

  <!-- ======== SETUP SCREEN ======== -->
  <div class="screen active" id="setupScreen">
    <div class="name-row">
      <label class="teal">Player 1:</label>
      <input class="name-input teal-border" id="name1" type="text" placeholder="Enter name..." maxlength="14" autocomplete="off">
    </div>
    <div class="pick-label teal" id="pickLabel1">Pick your character:</div>
    <div class="char-grid" id="gridP1"></div>

    <div class="name-row" style="margin-top:10px">
      <label class="red">Player 2:</label>
      <input class="name-input red-border" id="name2" type="text" placeholder="Enter name..." maxlength="14" autocomplete="off">
    </div>
    <div class="pick-label red" id="pickLabel2">Pick your character:</div>
    <div class="char-grid" id="gridP2"></div>

    <button class="start-btn" id="startBtn" disabled>Let's Go!</button>
  </div>

  <!-- ======== GAME SCREEN ======== -->
  <div class="screen" id="gameScreen">
    <div class="status teal" id="status"></div>
    <div class="board" id="board"></div>
    <div class="scoreboard">
      <span class="score-p score-p1" id="scoreP1"></span>
      <span class="score-tie">🤝 <b id="wd">0</b></span>
      <span class="score-p score-p2" id="scoreP2"></span>
    </div>
    <div class="streak" id="streak"></div>
    <div class="btn-row">
      <button class="game-btn btn-again" id="againBtn">Next Round 🚀</button>
      <button class="game-btn btn-reset" id="resetBtn">Reset Scores 🔄</button>
      <button class="game-btn btn-chars" id="charsBtn">New Game 🎨</button>
    </div>
  </div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
(function(){
  /* ---- characters ---- */
  var CHARACTERS = [
    '🦭','🐉','❌','⭕',
    '🐱','🐶','🦊','🐸','🐻','🦁','🐼','🐰',
    '🦄','🐙','🦋','🐢','🦈','🐝','🦖','🐧',
    '🦀','🐬','🐨','🐯','🦉','🐺','🦎','🐳'
  ];

  /* ---- floating bg ---- */
  var BG_EMOJI = ['✨','⭐','🦭','🐉','💚','❤️','🌊','🔥','🎉','🌈'];
  var shapesEl = document.getElementById('shapes');
  for(var i=0;i<20;i++){
    var s=document.createElement('span');
    s.textContent=BG_EMOJI[i%BG_EMOJI.length];
    s.style.left=Math.random()*100+'%';
    s.style.fontSize=(1.2+Math.random()*2.2)+'rem';
    s.style.animationDuration=(8+Math.random()*14)+'s';
    s.style.animationDelay=(Math.random()*12)+'s';
    shapesEl.appendChild(s);
  }

  /* ---- audio ---- */
  var AudioCtx=window.AudioContext||window.webkitAudioContext;
  var actx;
  function ensureAudio(){if(!actx)actx=new AudioCtx()}
  function tone(f,d,t){
    ensureAudio();
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.16,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.connect(g).connect(actx.destination);
    o.start();o.stop(actx.currentTime+d);
  }
  function sfxPlace(){tone(520,.12,'triangle')}
  function sfxWin(){tone(523,.1);setTimeout(function(){tone(659,.1)},100);setTimeout(function(){tone(784,.15)},200);setTimeout(function(){tone(1047,.25)},320)}
  function sfxTie(){tone(440,.15,'triangle');setTimeout(function(){tone(440,.15,'triangle')},180)}

  /* ---- state ---- */
  var p1={name:'',char:'🦭'};
  var p2={name:'',char:'🐉'};
  var cells,turn,locked;
  var p1Wins=0,p2Wins=0,draws=0;
  var winStreak={player:0,count:0};
  var roundNum=0;

  var setupScreen=document.getElementById('setupScreen');
  var gameScreen=document.getElementById('gameScreen');
  var gridP1=document.getElementById('gridP1');
  var gridP2=document.getElementById('gridP2');
  var startBtn=document.getElementById('startBtn');
  var name1Input=document.getElementById('name1');
  var name2Input=document.getElementById('name2');
  var boardEl=document.getElementById('board');
  var statusEl=document.getElementById('status');
  var againBtn=document.getElementById('againBtn');
  var resetBtn=document.getElementById('resetBtn');
  var charsBtn=document.getElementById('charsBtn');
  var confettiEl=document.getElementById('confetti');
  var streakEl=document.getElementById('streak');

  var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  /* ---- load saved state ---- */
  try{
    var saved=JSON.parse(localStorage.getItem('ttt_state'));
    if(saved){
      p1.name=saved.p1name||'';p1.char=saved.p1char||'🦭';
      p2.name=saved.p2name||'';p2.char=saved.p2char||'🐉';
      p1Wins=saved.p1w||0;p2Wins=saved.p2w||0;draws=saved.d||0;
      winStreak=saved.streak||{player:0,count:0};
    }
  }catch(e){}

  function saveState(){
    try{
      localStorage.setItem('ttt_state',JSON.stringify({
        p1name:p1.name,p1char:p1.char,p2name:p2.name,p2char:p2.char,
        p1w:p1Wins,p2w:p2Wins,d:draws,streak:winStreak
      }));
    }catch(e){}
  }

  /* ---- character picker ---- */
  function buildGrids(){
    gridP1.innerHTML='';gridP2.innerHTML='';
    CHARACTERS.forEach(function(ch){
      var b1=document.createElement('button');
      b1.className='char-opt';b1.textContent=ch;
      b1.addEventListener('click',function(){p1.char=ch;if(p2.char===ch)p2.char='';refreshPicks()});
      gridP1.appendChild(b1);

      var b2=document.createElement('button');
      b2.className='char-opt';b2.textContent=ch;
      b2.addEventListener('click',function(){p2.char=ch;if(p1.char===ch)p1.char='';refreshPicks()});
      gridP2.appendChild(b2);
    });
    refreshPicks();
  }

  function refreshPicks(){
    gridP1.querySelectorAll('.char-opt').forEach(function(b){
      b.className='char-opt';
      if(b.textContent===p1.char)b.classList.add('picked-teal');
      else if(b.textContent===p2.char)b.classList.add('taken');
    });
    gridP2.querySelectorAll('.char-opt').forEach(function(b){
      b.className='char-opt';
      if(b.textContent===p2.char)b.classList.add('picked-red');
      else if(b.textContent===p1.char)b.classList.add('taken');
    });
    checkReady();
  }

  function checkReady(){
    var n1=name1Input.value.trim();
    var n2=name2Input.value.trim();
    startBtn.disabled=!(n1&&n2&&p1.char&&p2.char);
  }

  name1Input.value=p1.name;
  name2Input.value=p2.name;
  name1Input.addEventListener('input',checkReady);
  name2Input.addEventListener('input',checkReady);
  buildGrids();

  /* ---- start game ---- */
  startBtn.addEventListener('click',function(){
    p1.name=name1Input.value.trim();
    p2.name=name2Input.value.trim();
    setupScreen.classList.remove('active');
    gameScreen.classList.add('active');
    updateScoreboard();
    resetBoard();
    saveState();
  });

  /* auto-start if returning with saved names */
  if(p1.name&&p2.name&&p1.char&&p2.char){
    name1Input.value=p1.name;
    name2Input.value=p2.name;
    checkReady();
  }

  charsBtn.addEventListener('click',function(){
    gameScreen.classList.remove('active');
    setupScreen.classList.add('active');
    setupScreen.style.animation='none';
    setupScreen.offsetHeight;
    setupScreen.style.animation='popIn .4s ease';
    name1Input.value=p1.name;
    name2Input.value=p2.name;
    buildGrids();
    checkReady();
  });

  againBtn.addEventListener('click',function(){
    againBtn.classList.remove('show');
    resetBoard();
  });

  resetBtn.addEventListener('click',function(){
    p1Wins=0;p2Wins=0;draws=0;
    winStreak={player:0,count:0};
    roundNum=0;
    updateScoreboard();
    saveState();
    resetBoard();
  });

  /* ---- board ---- */
  function render(winLine){
    boardEl.innerHTML='';
    cells.forEach(function(c,i){
      var el=document.createElement('button');
      el.className='cell';
      if(c){
        el.classList.add('filled',c===1?'p1':'p2');
        var span=document.createElement('span');
        span.className='cell-char';
        span.textContent=c===1?p1.char:p2.char;
        el.appendChild(span);
      }
      if(winLine&&winLine.indexOf(i)>=0)el.classList.add('win-cell');
      el.addEventListener('click',function(){onCell(i)});
      boardEl.appendChild(el);
    });
  }

  function resetBoard(){
    cells=Array(9).fill(0);
    turn=1;locked=false;
    statusEl.className='status teal';
    statusEl.textContent=p1.name+'\'s turn — '+p1.char;
    againBtn.classList.remove('show');
    render();
  }

  function updateScoreboard(){
    document.getElementById('scoreP1').innerHTML=p1.char+' '+p1.name+': <b>'+p1Wins+'</b>';
    document.getElementById('scoreP2').innerHTML=p2.char+' '+p2.name+': <b>'+p2Wins+'</b>';
    document.getElementById('wd').textContent=draws;
    if(winStreak.count>=2){
      var sName=winStreak.player===1?p1.name:p2.name;
      var sChar=winStreak.player===1?p1.char:p2.char;
      streakEl.textContent='🔥 '+sName+' '+sChar+' is on a '+winStreak.count+'-win streak!';
    }else{
      streakEl.textContent='';
    }
  }

  function winner(s){
    for(var i=0;i<LINES.length;i++){
      var ln=LINES[i];
      if(s[ln[0]]&&s[ln[0]]===s[ln[1]]&&s[ln[0]]===s[ln[2]])
        return{who:s[ln[0]],line:ln};
    }
    if(s.every(function(v){return v}))return{who:'draw'};
    return null;
  }

  function endRound(w){
    locked=true;roundNum++;
    if(w.who===1||w.who===2){
      var isP1=w.who===1;
      if(isP1)p1Wins++;else p2Wins++;
      if(winStreak.player===w.who){winStreak.count++}
      else{winStreak.player=w.who;winStreak.count=1}
      var wName=isP1?p1.name:p2.name;
      var wChar=isP1?p1.char:p2.char;
      statusEl.className='status win';
      statusEl.innerHTML='';
      var banner=document.createElement('div');
      banner.className='winner-banner green';
      banner.textContent=wChar+' '+wName+' wins! 🎉';
      statusEl.appendChild(banner);
      render(w.line);
      sfxWin();
      launchConfetti();
    }else{
      draws++;
      winStreak={player:0,count:0};
      statusEl.className='status tie';
      statusEl.innerHTML='';
      var banner=document.createElement('div');
      banner.className='winner-banner gold';
      banner.textContent='🤝 It\'s a tie!';
      statusEl.appendChild(banner);
      render();
      sfxTie();
    }
    updateScoreboard();
    saveState();
    setTimeout(function(){againBtn.classList.add('show')},500);
  }

  function onCell(i){
    if(locked||cells[i])return;
    cells[i]=turn;
    sfxPlace();
    render();
    var w=winner(cells);
    if(w){endRound(w);return}
    turn=turn===1?2:1;
    var cur=turn===1?p1:p2;
    statusEl.className='status '+(turn===1?'teal':'red');
    statusEl.textContent=cur.name+'\'s turn — '+cur.char;
  }

  /* ---- confetti ---- */
  function launchConfetti(){
    var colors=['#0d9488','#14b8a6','#ef4444','#f59e0b','#3b82f6','#8b5cf6','#22c55e','#f97316'];
    for(var i=0;i<80;i++){
      var p=document.createElement('div');
      p.className='confetti-piece';
      p.style.left=Math.random()*100+'%';
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      var sz=6+Math.random()*10;
      p.style.width=sz+'px';p.style.height=sz+'px';
      p.style.borderRadius=Math.random()>.5?'50%':'2px';
      p.style.animationDuration=(1+Math.random()*2)+'s';
      p.style.animationDelay=(Math.random()*.7)+'s';
      confettiEl.appendChild(p);
    }
    setTimeout(function(){confettiEl.innerHTML=''},4000);
  }
})();
</script>
</body>
</html>
